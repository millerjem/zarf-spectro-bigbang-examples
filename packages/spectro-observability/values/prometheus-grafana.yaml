grafana:
  persistence:
    enabled: true
    storageClassName: "###ZARF_VAR_STORAGE_CLASS###"
    size: "###ZARF_VAR_GRAFANA_STORAGE_SIZE###"
prometheus:
  prometheusSpec:
    retention: "###ZARF_VAR_PROMETHEUS_RETENTION###"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "###ZARF_VAR_STORAGE_CLASS###"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "###ZARF_VAR_PROMETHEUS_STORAGE_SIZE###"

