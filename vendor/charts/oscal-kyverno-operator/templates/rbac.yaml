{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "oscal-kyverno-operator.serviceAccountName" . | quote }}
  labels:
    {{- include "oscal-kyverno-operator.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oscal-kyverno-operator.name" . | quote }}
  labels:
    {{- include "oscal-kyverno-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - compliance.spectrocloud.com
    resources:
      - oscaldocuments
      - oscalkyvernomappings
      - oscalpolicies
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - compliance.spectrocloud.com
    resources:
      - oscaldocuments/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - compliance.spectrocloud.com
    resources:
      - oscalpolicies
    verbs:
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - kyverno.io
    resources:
      - clusterpolicies
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oscal-kyverno-operator.name" . | quote }}
  labels:
    {{- include "oscal-kyverno-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oscal-kyverno-operator.name" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oscal-kyverno-operator.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
