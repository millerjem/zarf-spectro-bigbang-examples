apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: oscaldocuments.compliance.spectrocloud.com
spec:
  group: compliance.spectrocloud.com
  scope: Cluster
  names:
    plural: oscaldocuments
    singular: oscaldocument
    kind: OSCALDocument
    shortNames:
      - oscaldoc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - oscal
              properties:
                preset:
                  type: string
                  description: Desired Kyverno enforcement preset. Audit is discovery mode; Enforce blocks non-compliant resources.
                  enum:
                    - audit
                    - enforce
                    - Audit
                    - Enforce
                mappingRef:
                  type: object
                  properties:
                    name:
                      type: string
                output:
                  type: object
                  properties:
                    scope:
                      type: string
                      enum:
                        - Cluster
                controlScopes:
                  type: array
                  description: Optional per-control namespace scoping overrides applied after mapping defaults.
                  items:
                    type: object
                    required:
                      - controlIds
                    properties:
                      name:
                        type: string
                      controlIds:
                        type: array
                        items:
                          type: string
                      includeNamespaces:
                        type: array
                        description: If set, generated Kyverno rules for matching controls only match these namespaces.
                        items:
                          type: string
                      excludeNamespaces:
                        type: array
                        description: Generated Kyverno rules for matching controls skip these namespaces.
                        items:
                          type: string
                oscal:
                  type: object
                  description: Embedded OSCAL profile, catalog fragment, component definition, or resolved profile.
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Preset
          type: string
          jsonPath: .spec.preset
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Generated
          type: integer
          jsonPath: .status.generatedPolicyCount
