{{- if .Values.kyverno.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ include "zta-device-posture-guardrails.name" . | quote }}
  labels:
    {{- include "zta-device-posture-guardrails.labels" . | nindent 4 }}
spec:
  validationFailureAction: {{ .Values.policy.validationFailureAction | quote }}
  background: {{ .Values.policy.background }}
  rules:
    - name: require-pod-security-posture
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.policy.excludeNamespaces | nindent 16 }}
      validate:
        message: "Pods must satisfy the selected Pod Security posture for zero trust device and node exposure control."
        podSecurity:
          level: {{ .Values.policy.podSecurityLevel | quote }}
          version: {{ .Values.policy.podSecurityVersion | quote }}
{{- end }}
