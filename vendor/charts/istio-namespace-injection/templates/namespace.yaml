{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "namespace.name is required" .Values.namespace.name | quote }}
  labels:
    {{- include "istio-namespace-injection.labels" . | nindent 4 }}
    {{- if .Values.istio.injection.enabled }}
    {{ .Values.istio.injection.labelKey | quote }}: {{ .Values.istio.injection.labelValue | quote }}
    {{- end }}
    {{- with .Values.namespace.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.namespace.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
